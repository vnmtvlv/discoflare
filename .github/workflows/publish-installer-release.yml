name: Publish Cloudflare installer release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@78aafc6d0224f574e69a4e53b93e60ef4c80e1e1 # v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        env:
          DISCOFLARE_RELEASE_VERSION: ${{ github.event.release.tag_name }}
          DISCOFLARE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}
        run: pnpm release:installer

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" .installer/release/* --clobber

  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Normalize release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Sandbox image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.sandbox
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/vnmtvlv/discoflare-sandbox:${{ steps.version.outputs.value }}
            docker.io/vnmtvlv/discoflare-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
