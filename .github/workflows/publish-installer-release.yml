name: Publish Cloudflare installer release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        env:
          DISCOFLARE_RELEASE_VERSION: ${{ github.event.release.tag_name }}
          DISCOFLARE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}
        run: pnpm release:installer

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" .installer/release/* --clobber
