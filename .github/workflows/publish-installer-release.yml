name: Publish Cloudflare installer release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.RELEASE_TAG) throw new Error('Release tag must equal v'+p.version)"

      - name: Build release artifacts
        env:
          DISCOFLARE_RELEASE_VERSION: ${{ github.ref_name }}
          DISCOFLARE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: pnpm release:installer

      - name: Verify immutable releases are enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled="$(gh api "repos/${{ github.repository }}/immutable-releases" --jq .enabled)"
          if [[ "$enabled" != "true" ]]; then
            echo "::error::Enable native release immutability before publishing a Discoflare release"
            exit 1
          fi

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/release-notes/${RELEASE_TAG}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error file=${notes}::Release notes must exist before tagging"
            exit 1
          fi

          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == "false" ]]; then
            echo "::error::Release ${RELEASE_TAG} is already published and cannot be changed"
            exit 1
          fi

          title="Discoflare ${RELEASE_TAG#v}"
          if [[ "$draft" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$title" --notes-file "$notes"
          fi

      - name: Upload and verify draft artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" .installer/release/* --clobber
          find .installer/release -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/release-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/release-assets"

          {
            echo "### Draft Discoflare release"
            echo
            echo "Built and verified all artifacts for \`${RELEASE_TAG}\`. Review and publish the draft release manually."
          } >> "$GITHUB_STEP_SUMMARY"
