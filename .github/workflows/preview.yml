name: Worker Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: worker-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy PR Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCOFLARE_PREVIEW_PR: ${{ github.event.pull_request.number }}
      DISCOFLARE_PREVIEW_AUTH_SECRET: ${{ secrets.DISCOFLARE_PREVIEW_AUTH_SECRET }}
      DISCOFLARE_PREVIEW_ADMIN_PASSWORD: ${{ secrets.DISCOFLARE_PREVIEW_ADMIN_PASSWORD }}
      DISCOFLARE_PREVIEW_ACCESS_CLIENT_ID: ${{ secrets.DISCOFLARE_PREVIEW_ACCESS_CLIENT_ID }}
      DISCOFLARE_PREVIEW_ACCESS_CLIENT_SECRET: ${{ secrets.DISCOFLARE_PREVIEW_ACCESS_CLIENT_SECRET }}
      DISCOFLARE_PREVIEW_ADMIN_EMAIL: ${{ vars.DISCOFLARE_PREVIEW_ADMIN_EMAIL }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Preview credentials
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCOFLARE_PREVIEW_ACCESS_CLIENT_ID DISCOFLARE_PREVIEW_ACCESS_CLIENT_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          if (( ${#DISCOFLARE_PREVIEW_AUTH_SECRET} < 32 )); then
            echo "::error::DISCOFLARE_PREVIEW_AUTH_SECRET must contain at least 32 characters"
            missing=1
          fi
          if (( ${#DISCOFLARE_PREVIEW_ADMIN_PASSWORD} < 8 )); then
            echo "::error::DISCOFLARE_PREVIEW_ADMIN_PASSWORD must contain at least 8 characters"
            missing=1
          fi
          exit "$missing"

      - name: Provision isolated Preview resources
        run: pnpm preview:prepare -- "$DISCOFLARE_PREVIEW_PR"

      - name: Apply branch D1 migrations
        run: >-
          pnpm exec wrangler d1 migrations apply PREVIEW_DB --remote
          --config .wrangler.preview-migrations.generated.jsonc

      - name: Build Worker
        run: pnpm build

      - name: Deploy Worker Preview
        run: >-
          pnpm exec wrangler preview
          --name "pr-${DISCOFLARE_PREVIEW_PR}"
          --tag "${GITHUB_SHA}"
          --message "PR #${DISCOFLARE_PREVIEW_PR} ${GITHUB_SHA}"
          --config .wrangler.preview.generated.jsonc
          --secrets-file .preview/secrets.json
          --ignore-base-config
          --json > .preview/deployment.json

      - id: preview
        name: Read Preview URLs
        run: node scripts/preview-report.mjs outputs .preview/deployment.json

      - name: Verify Preview health and bootstrap
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: >-
          curl --fail --silent --show-error
          --retry 12 --retry-delay 5 --retry-all-errors
          --header "CF-Access-Client-Id: $DISCOFLARE_PREVIEW_ACCESS_CLIENT_ID"
          --header "CF-Access-Client-Secret: $DISCOFLARE_PREVIEW_ACCESS_CLIENT_SECRET"
          "$PREVIEW_URL/api/setup/health"
          | jq -e 'select(.ok == true and .ready == true and .bindings.db == true and .bindings.r2 == true and .bindings.kv == true and .bindings.agentWorkflow == false)'

      - name: Update pull request Preview link
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preview-report.mjs comment .preview/deployment.json

  cleanup:
    name: Delete closed PR Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCOFLARE_PREVIEW_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Preview and isolated resources
        run: pnpm preview:cleanup -- "$DISCOFLARE_PREVIEW_PR"

  sweep:
    name: Retry orphan cleanup
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_prs="$(gh pr list --state open --limit 1000 --json number --jq 'map(.number | tostring) | join(",")')"
          echo "DISCOFLARE_OPEN_PREVIEW_PRS=$open_prs" >> "$GITHUB_ENV"

      - name: Retry cleanup for closed pull requests
        run: pnpm preview:sweep
