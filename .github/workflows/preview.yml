name: Worker Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: worker-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy PR Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    outputs:
      deployment_url: ${{ steps.preview.outputs.deployment_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DISCOFLARE_PREVIEW_AUTH_SECRET: ${{ secrets.DISCOFLARE_PREVIEW_AUTH_SECRET }}
      DISCOFLARE_PREVIEW_ADMIN_EMAIL: ${{ secrets.DISCOFLARE_PREVIEW_ADMIN_EMAIL }}
      DISCOFLARE_PREVIEW_ADMIN_PASSWORD: ${{ secrets.DISCOFLARE_PREVIEW_ADMIN_PASSWORD }}
      DISCOFLARE_PREVIEW_PR: ${{ github.event.pull_request.number }}
      DISCOFLARE_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration sequence
        run: pnpm db:migrations:check

      - name: Validate Preview credentials
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured in the preview environment"
              missing=1
            fi
          done
          if (( ${#DISCOFLARE_PREVIEW_AUTH_SECRET} < 32 )); then
            echo "::error::DISCOFLARE_PREVIEW_AUTH_SECRET must contain at least 32 characters"
            missing=1
          fi
          if [[ "$DISCOFLARE_PREVIEW_ADMIN_EMAIL" != *@* ]]; then
            echo "::error::DISCOFLARE_PREVIEW_ADMIN_EMAIL must contain an email address"
            missing=1
          fi
          if (( ${#DISCOFLARE_PREVIEW_ADMIN_PASSWORD} < 12 )); then
            echo "::error::DISCOFLARE_PREVIEW_ADMIN_PASSWORD must contain at least 12 characters"
            missing=1
          fi
          exit "$missing"

      - name: Provision isolated Preview resources
        run: pnpm preview:prepare "$DISCOFLARE_PREVIEW_PR"

      - name: Apply branch D1 migrations
        run: >-
          pnpm exec wrangler d1 migrations apply PREVIEW_DB --remote
          --config .wrangler.preview-migrations.generated.jsonc

      - name: Build Worker
        run: pnpm build

      - name: Deploy Worker Preview
        env:
          WRANGLER_OUTPUT_FILE_PATH: .preview/deployment.ndjson
        run: >-
          pnpm exec wrangler preview
          --name "pr-${DISCOFLARE_PREVIEW_PR}"
          --tag "${DISCOFLARE_PREVIEW_SHA}"
          --message "PR #${DISCOFLARE_PREVIEW_PR} ${DISCOFLARE_PREVIEW_SHA}"
          --config .wrangler.preview.generated.jsonc
          --secrets-file .preview/secrets.json
          --ignore-base-config
          --json

      - id: preview
        name: Read Preview URLs
        run: node scripts/preview-report.mjs outputs .preview/deployment.ndjson

      - name: Verify Preview health and bootstrap
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: >-
          curl --fail --silent --show-error
          --retry 12 --retry-delay 5 --retry-all-errors
          "$PREVIEW_URL/api/setup/health"
          | jq -e 'select(.ok == true and .ready == true and .users == 1 and ([.bindings.db, .bindings.r2, .bindings.kv, .bindings.channelDo, .bindings.workspaceDo, .bindings.rateLimitDo, .bindings.notificationDo, .bindings.agentDo, .bindings.workersAi, .bindings.browser] | all))'

      - name: Update pull request Preview link
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preview-report.mjs comment .preview/deployment.ndjson

      - name: Build Discoflare Admin for runtime verification
        run: pnpm --filter @discoflare/admin build

      - name: Verify a workspace Worker Preview without R2
        run: node scripts/preview-no-files.mjs

      - name: Verify recovery on an isolated Admin Worker and clean up
        run: node scripts/admin-preview-smoke.mjs

  e2e:
    name: E2E PR Preview
    needs: deploy
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the deployed PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm --filter @discoflare/e2e exec e2e-web install chromium --with-deps

      - name: Restore verified agent actions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/e2e/.e2e/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/e2e/**/*.ts') }}-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/e2e/**/*.ts') }}-${{ github.event.pull_request.number }}-

      - name: Run chat delivery and OpenRouter agent tests
        env:
          APP_URL: ${{ needs.deploy.outputs.deployment_url }}
          E2E_USER_ADMIN_USERNAME: ${{ secrets.DISCOFLARE_PREVIEW_ADMIN_EMAIL }}
          E2E_USER_ADMIN_PASSWORD: ${{ secrets.DISCOFLARE_PREVIEW_ADMIN_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          E2E_MODEL: ${{ vars.DISCOFLARE_E2E_MODEL }}
          E2E_AI: '1'
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::Add OPENROUTER_API_KEY to the preview environment secrets"
            exit 1
          fi
          pnpm test:e2e

      - name: Publish test summary
        if: ${{ !cancelled() }}
        run: |
          if [[ -f packages/e2e/.e2e/summary.md ]]; then
            cat packages/e2e/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            packages/e2e/.e2e/report.json
            packages/e2e/.e2e/junit.xml
            packages/e2e/.e2e/summary.md
            packages/e2e/.e2e/artifacts
          retention-days: 7
          if-no-files-found: warn

  cleanup:
    name: Delete closed PR Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DISCOFLARE_PREVIEW_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Preview and isolated resources
        run: pnpm preview:cleanup "$DISCOFLARE_PREVIEW_PR"

  sweep:
    name: Retry orphan cleanup
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_prs="$(gh pr list --state open --limit 1000 --json number --jq 'map(.number | tostring) | join(",")')"
          echo "DISCOFLARE_OPEN_PREVIEW_PRS=$open_prs" >> "$GITHUB_ENV"

      - name: Retry cleanup for closed pull requests
        run: pnpm preview:sweep
