name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, build, migrations]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        if: matrix.check != 'test' && matrix.check != 'migrations'
        run: pnpm run ${{ matrix.check }}

      - name: Validate migration history
        if: matrix.check == 'migrations'
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: pnpm db:migrations:check

      - name: Apply all migrations to a fresh local D1 database
        if: matrix.check == 'migrations'
        run: |
          migration_state="$(mktemp -d)"
          pnpm exec wrangler d1 migrations apply DB --local --persist-to "$migration_state"

      - name: Check client types
        if: matrix.check == 'typecheck'
        run: >-
          pnpm --filter @discoflare/mobile typecheck &&
          pnpm --filter @discoflare/desktop typecheck &&
          pnpm --filter @discoflare/extension typecheck

      # Keep test output in the log: the GitHub annotations reporter crashes
      # the runner with a Unicode EncoderFallbackException on this suite.
      - name: Run test
        if: matrix.check == 'test'
        run: pnpm test --reporter=default
