name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, build, migrations]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        if: matrix.check != 'test' && matrix.check != 'migrations'
        run: pnpm run ${{ matrix.check }}

      - name: Validate migration history
        if: matrix.check == 'migrations'
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: pnpm db:migrations:check

      - name: Apply all migrations to a fresh local D1 database
        if: matrix.check == 'migrations'
        run: |
          migration_state="$(mktemp -d)"
          pnpm exec wrangler d1 migrations apply DB --local --persist-to "$migration_state"

      - name: Check client types
        if: matrix.check == 'typecheck'
        run: >-
          pnpm --filter @discoflare/mobile typecheck &&
          pnpm --filter @discoflare/desktop typecheck &&
          pnpm --filter @discoflare/extension typecheck

      - name: Check the Discoflare Admin types
        if: matrix.check == 'typecheck'
        run: pnpm --filter @discoflare/admin typecheck

      - name: Build and bundle the Discoflare Admin
        if: matrix.check == 'build'
        run: pnpm --filter @discoflare/admin bundle

      # Keep test output in the log: the GitHub annotations reporter crashes
      # the runner with a Unicode EncoderFallbackException on this suite.
      - name: Run test
        if: matrix.check == 'test'
        run: pnpm test --reporter=default
